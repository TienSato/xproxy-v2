name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Lõi không phụ thuộc Tauri nên test được trên Linux, nhanh và rẻ.
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p xproxy-core

  # Tauri KHÔNG cross-compile được, nên mỗi hệ điều hành phải build trên chính nó.
  # Đây là cách duy nhất ra được file cài Windows mà không cần sở hữu máy Windows.
  bundle:
    needs: test-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macOS (Apple Silicon)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows x64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    # Mặc định GITHUB_TOKEN chỉ có quyền ĐỌC, nên bước tạo Release sẽ trả
    # "Resource not accessible by integration". Phải xin quyền ghi ở đây.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          # Đẩy tag v* lên là tự tạo Release kèm .dmg và .exe
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: xproxy ${{ github.ref_name }}
          releaseDraft: true

      # Không phải tag thì vẫn giữ file build lại để tải về thủ công.
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: xproxy-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore
